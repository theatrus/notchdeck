name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, toolchain-free: guards the protocol/report layer (sizes, offsets, IDs).
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Host protocol test
        run: make -C firmware test
      - name: Verify handle drawings and cam table match firmware
        run: |
          python3 hardware/scripts/notchdeck-handle-layout.py
          git diff --exit-code -- hardware/mechanical/

  # DK bring-up build and Rev C/D compile checks; no production bootloader yet.
  firmware-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      # Pulls NCS (imports Zephyr + modules) per firmware/west.yml and installs the
      # arm-zephyr-eabi toolchain. self.path in west.yml must equal app-path.
      - name: Set up NCS / Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          toolchains: arm-zephyr-eabi
      - name: Build (nrf52840dk)
        run: make -C firmware uf2 BUILD=../build
      - name: Build Rev C/D handle profiles
        run: |
          for profile in combined_magnetic combined_gray dual_magnetic dual_gray dual_mixed dual_gray_power; do
            west build --sysbuild -b nrf52840dk/nrf52840 firmware -d "build-$profile" -- \
              -DDTC_OVERLAY_FILE=boards/notchdeck_rev_c.overlay \
              "-DEXTRA_CONF_FILE=configs/rev_c.conf;configs/$profile.conf"
          done
      - name: Collect artifacts
        run: |
          mkdir -p dist
          # NCS sysbuild places this app's outputs under its firmware domain.
          cp build/firmware/zephyr/zephyr.uf2 dist/notchdeck-one.uf2
          cp build/firmware/zephyr/zephyr.hex dist/notchdeck-one.hex
      - uses: actions/upload-artifact@v4
        with:
          name: notchdeck-one-firmware
          path: dist/
          if-no-files-found: error

  # Hardware sanity: KiCad libraries parse, schematic ERC, BOM exports.
  # Pinned release with libraries; the old nightly tag predates the file format.
  hardware-checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0.1-full@sha256:4af6719b866c269157c77aef47ddd9c045372ea5eba5b6edd35ce1450b14a0a6
      options: --user root      # kicad image defaults to a non-root user; runner temp needs root
    steps:
      - uses: actions/checkout@v5
      - name: Install hardware validation dependencies
        run: |
          # The KiCad image includes Python and libraries, but not GNU Make.
          apt-get update
          apt-get install --yes --no-install-recommends make
      - name: Validate libraries + export BOM
        working-directory: hardware
        run: |
          kicad-cli version
          # Headless runs have no first-launch wizard to install global tables.
          mkdir -p ~/.config/kicad/10.0
          cp /usr/share/kicad/template/sym-lib-table ~/.config/kicad/10.0/
          cp /usr/share/kicad/template/fp-lib-table ~/.config/kicad/10.0/
          make verify KICAD_PYTHON=python3
          for project in notchdeck-one notchdeck-buttons; do
            kicad-cli pcb drc --schematic-parity --format json \
              -o "/tmp/$project-drc.json" "$project/$project.kicad_pcb"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert not d["violations"] and not d["schematic_parity"]; print(len(d["unconnected_items"]), "unrouted items (floorplan)")' "/tmp/$project-drc.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: notchdeck-boms
          path: hardware/*/jlcpcb_bom.csv
          if-no-files-found: error

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast, toolchain-free: guards the protocol/report layer (sizes, offsets, IDs).
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Host protocol test
        run: make -C firmware test

  # Full nRF Connect SDK build for the nRF52840. Produces the .uf2 update artifact.
  firmware-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      # Pulls NCS (imports Zephyr + modules) per firmware/west.yml and installs the
      # arm-zephyr-eabi toolchain. self.path in west.yml must equal app-path.
      - name: Set up NCS / Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: firmware
          toolchains: arm-zephyr-eabi
      - name: Build (nrf52840dk)
        run: west build -b nrf52840dk/nrf52840 firmware -d build
      - name: Build Rev C handle profiles
        run: |
          for profile in combined_magnetic combined_gray dual_magnetic dual_gray dual_mixed dual_gray_power; do
            west build -b nrf52840dk/nrf52840 firmware -d "build-$profile" -- \
              -DDTC_OVERLAY_FILE=boards/notchdeck_rev_c.overlay \
              "-DEXTRA_CONF_FILE=configs/rev_c.conf;configs/$profile.conf"
          done
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/zephyr/zephyr.uf2 dist/notchdeck-one.uf2 || true
          cp build/zephyr/zephyr.hex dist/notchdeck-one.hex || true
      - uses: actions/upload-artifact@v4
        with:
          name: notchdeck-one-firmware
          path: dist/
          if-no-files-found: warn

  # Hardware sanity: KiCad libraries parse, schematic ERC, BOM exports.
  # Pinned release with libraries; the old nightly tag predates the file format.
  hardware-checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0.1-full@sha256:4af6719b866c269157c77aef47ddd9c045372ea5eba5b6edd35ce1450b14a0a6
      options: --user root      # kicad image defaults to a non-root user; runner temp needs root
    steps:
      - uses: actions/checkout@v5
      - name: Validate libraries + export BOM
        working-directory: hardware
        run: |
          kicad-cli version
          # Headless runs have no first-launch wizard to install global tables.
          mkdir -p ~/.config/kicad/10.0
          cp /usr/share/kicad/template/sym-lib-table ~/.config/kicad/10.0/
          cp /usr/share/kicad/template/fp-lib-table ~/.config/kicad/10.0/
          python3 scripts/notchdeck-netcheck.py
          python3 scripts/notchdeck-boardcheck.py
          kicad-cli sch export bom \
            --output notchdeck-one/jlcpcb_bom.csv \
            --fields '${ITEM_NUMBER},Reference,Value,Footprint,${QUANTITY},LCSC,MPN,Manufacturer,BOM Comments' \
            --labels 'Item,Designator,Comment,Footprint,Qty,LCSC Part #,MPN,Manufacturer,Notes' \
            --group-by 'Value,Footprint,LCSC,MPN,Manufacturer' \
            --ref-range-delimiter '' --exclude-dnp \
            notchdeck-one/notchdeck-one.kicad_sch
          python3 scripts/notchdeck-bomcheck.py
          kicad-cli pcb drc --schematic-parity --format json \
            -o /tmp/notchdeck-drc.json notchdeck-one/notchdeck-one.kicad_pcb
          python3 -c 'import json; d=json.load(open("/tmp/notchdeck-drc.json")); assert not d["violations"] and not d["schematic_parity"]; print(len(d["unconnected_items"]), "unrouted items (floorplan)")'
      - uses: actions/upload-artifact@v4
        with:
          name: notchdeck-one-bom
          path: hardware/notchdeck-one/jlcpcb_bom.csv
          if-no-files-found: warn

# NotchDeck One — Zephyr / nRF Connect SDK config (SKELETON)
# Target SoC: nRF52840 (USB + BLE). Verify against your installed NCS version.

CONFIG_LOG=y

# --- Inputs: buttons (GPIO) + AS5600 lever (I2C) ---
CONFIG_GPIO=y
CONFIG_I2C=y

# --- LEDs: WS2812 strip over SPI ---
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# --- USB device + HID ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y
CONFIG_ENABLE_HID_INT_OUT_EP=y         # output reports (LED control)
CONFIG_USB_DEVICE_MANUFACTURER="BenchBits"
CONFIG_USB_DEVICE_PRODUCT="NotchDeck One"
# TODO: allocate our own USB IDs. 0x1209 = pid.codes (open-source); request a PID.
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x0001

# --- Bluetooth peripheral + HID-over-GATT + Battery ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="NotchDeck One"
CONFIG_BT_DEVICE_APPEARANCE=964        # 0x03C4 = Gamepad
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_BAS=y
CONFIG_BT_SMP=y

# --- Persistent bonds ---
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- Firmware update / DFU (see docs/05-firmware-update.md) ---
# Primary user path = UF2 drag-and-drop via the UF2 bootloader. Emit a .uf2 on build.
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_REBOOT=y                        # sys_reboot() for programmatic DFU entry (dfu.c)
# App version comes from the VERSION file -> app_version.h (APP_VERSION_STRING).

# Device Information Service advertises the firmware revision over BLE.
# Keep *_STR in sync with VERSION (the release target stamps it).
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF="BenchBits"
CONFIG_BT_DIS_MODEL="NotchDeck One"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="0.1.0"

# --- Sizing ---
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
